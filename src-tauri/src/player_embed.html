<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000}iframe{display:block;border:0}#status{color:white;font:14px sans-serif}</style></head>
<body><div id="player"></div><div id="status" role="status"></div><script>
const videoId = __VIDEO_ID__;
const origin = __ORIGIN__;
let player;
let timer;
function report(state) { parent.postMessage({ type: 'mytube-player', videoId, state }, '*'); }
function stop(message) {
  clearInterval(timer);
  clearTimeout(timeout);
  if (player) { player.destroy(); player = null; }
  document.getElementById('status').textContent = message;
  report(message);
}
function checkSelection() {
  if (!player?.getVideoUrl) return;
  const url = player.getVideoUrl();
  if (url && new URL(url).searchParams.get('v') !== videoId) stop('選択した動画の再生を終了しました。');
}
const timeout = setTimeout(() => stop('プレイヤーを読み込めませんでした。'), 20000);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    videoId, width: '100%', height: '100%',
    playerVars: { autoplay: 0, rel: 0, fs: 1, playsinline: 1, origin },
    events: {
      onReady() { clearTimeout(timeout); timer = setInterval(checkSelection, 250); report('ready'); },
      onStateChange(event) { checkSelection(); report('state-' + event.data); },
      onError(event) { stop('動画を再生できませんでした。（エラー ' + event.data + '）'); }
    }
  });
};
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
