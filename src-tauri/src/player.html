<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>MyTube</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#0f0f0f;font:14px Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.topbar{height:68px;display:flex;align-items:center;gap:16px;padding:0 40px;border-bottom:1px solid #e5e5e5}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.8px;white-space:nowrap}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:20px;background:#f03;color:#fff}.mark svg{width:24px;height:24px}button,input{font:inherit}button{cursor:pointer}.back{width:36px;height:36px;padding:0;border:0;border-radius:50%;background:transparent;font-size:25px;line-height:1;color:#0f0f0f}.back:hover{background:#f2f2f2}.search{display:flex;align-items:center;flex:1;max-width:600px;margin-left:auto;gap:8px}.search input{width:100%;height:40px;padding:0 16px;border:1px solid #ccc;border-radius:18px;color:#0f0f0f;outline:0}.search input:focus{border-color:#f03;box-shadow:0 0 0 1px #f03}.search button{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:transparent;color:#0f0f0f}.search button svg{width:24px;height:24px}.search button:hover:not(:disabled){background:#f2f2f2}.search button:disabled{cursor:default;opacity:.38}.page{max-width:1280px;margin:0 auto;padding:28px 32px}.stage{width:100%;aspect-ratio:16/9;min-height:240px;background:#000}iframe{display:block;width:100%;height:100%;border:0}.details{padding-top:18px}.title{margin:0;font-size:20px;line-height:1.45;font-weight:650}.channel-row{display:flex;align-items:center;gap:12px;margin-top:16px}.avatar{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;overflow:hidden;border-radius:50%;background:#e5e5e5;font-weight:700}.channel{font-weight:600}.subscribe{margin-left:8px;border:0;border-radius:18px;padding:9px 18px;background:#f03;color:#fff;font-weight:600}.subscribe:hover{background:#cc0029}.description{margin:18px 0 0;line-height:1.55;white-space:pre-wrap}.status{margin:18px 0 0;color:#606060}.retry{border:1px solid #ccc;border-radius:18px;padding:8px 16px;background:#fff;color:#0f0f0f}[hidden]{display:none!important}@media(max-width:640px){.topbar{height:auto;min-height:68px;padding:12px 16px;flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.page{padding:16px}.title{font-size:17px}.channel-row{flex-wrap:wrap}.subscribe{margin-left:auto}}
</style></head>
<body><header class="topbar"><button id="back" class="back" aria-label="戻る">←</button><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></span><span>MyTube</span></div><form id="search-form" class="search"><input id="search-input" type="search" placeholder="検索…" aria-label="検索"><button id="search-button" aria-label="検索" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.5 3a6.5 6.5 0 1 0 3.98 11.64L19.85 21 21 19.85l-6.36-6.37A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg></button></form></header><main class="page"><div id="stage" class="stage"><div id="player"></div></div><section class="details"><h1 id="video-title" class="title"></h1><div class="channel-row"><div id="avatar" class="avatar"></div><div id="channel" class="channel"></div><button id="subscribe" class="subscribe">サブスクライブ</button></div><p id="video-description" class="description"></p><p id="status" class="status" role="status">プレイヤーを読み込んでいます…</p><button id="retry" class="retry" hidden>再試行</button></section></main>
<script>
const videoId = __VIDEO_ID__;
const origin = __ORIGIN__;
const returnUrl = __RETURN_URL__;
const videoTitle = __TITLE__;
const channelName = __CHANNEL__;
const channelIcon = __CHANNEL_ICON__;
const description = __DESCRIPTION__;
let player;
let timer;
let readyTimeout;
let apiWanted = true;
const stage = document.getElementById('stage');
const status = document.getElementById('status');
const retry = document.getElementById('retry');
document.getElementById('video-title').textContent = videoTitle;
document.getElementById('channel').textContent = channelName;
if (description) {
  document.getElementById('video-description').textContent = description;
} else {
  document.getElementById('video-description').hidden = true;
}
const avatar = document.getElementById('avatar');
function setAvatar(icon, channel) {
  avatar.replaceChildren();
  if (!icon) { avatar.textContent = channel.slice(0, 1); return; }
  const img = document.createElement('img');
  img.src = icon;
  img.alt = '';
  img.style.width = '40px';
  img.style.height = '40px';
  img.style.borderRadius = '50%';
  img.style.objectFit = 'cover';
  img.onerror = () => { img.remove(); avatar.textContent = channel.slice(0, 1); };
  avatar.appendChild(img);
}
setAvatar(channelIcon, channelName);
window.__setVideoDetails = (id, channel, icon, text) => {
  if (id !== videoId) return;
  document.getElementById('channel').textContent = channel;
  setAvatar(icon, channel);
  const descriptionElement = document.getElementById('video-description');
  descriptionElement.textContent = text;
  descriptionElement.hidden = !text;
};
function finish(message, state) { apiWanted = false; clearInterval(timer); clearTimeout(readyTimeout); if (player) { player.destroy(); player = null; } stage.replaceChildren(); stage.hidden = true; status.textContent = message; retry.hidden = false; document.title = 'MyTube: ' + state; }
function checkSelection() { if (!player || !player.getVideoUrl) return; const url = player.getVideoUrl(); if (url && new URL(url).searchParams.get('v') !== videoId) finish('選択した動画の再生を終了しました。', 'stopped'); }
function createPlayer() { retry.hidden = true; stage.hidden = false; stage.innerHTML = '<div id="player"></div>'; status.textContent = 'プレイヤーを読み込んでいます…'; document.title = 'MyTube: loading'; readyTimeout = setTimeout(() => finish('プレイヤーを読み込めませんでした。接続を確認して再試行してください。', 'error'), 20000); player = new YT.Player('player', { videoId, width: '100%', height: '100%', playerVars: { autoplay: 0, rel: 0, playsinline: 1, origin }, events: { onReady() { clearTimeout(readyTimeout); status.textContent = ''; document.title = 'MyTube: ready'; timer = setInterval(checkSelection, 250); }, onStateChange(event) { checkSelection(); if (!player) return; if (event.data === 0) finish('再生が終了しました。', 'ended'); else if (event.data === 1) document.title = 'MyTube: playing'; else if (event.data === 2) document.title = 'MyTube: paused'; }, onError(event) { const message = [101,150].includes(event.data) ? 'この動画は埋め込み再生が許可されていません。' : event.data === 100 ? 'この動画は削除されたか、非公開です。' : '動画を再生できませんでした。接続を確認するか、別の動画を選んでください。'; finish(message + '（エラー ' + event.data + '）', 'error-' + event.data); } } }); }
window.onYouTubeIframeAPIReady = () => { if (apiWanted) { clearTimeout(readyTimeout); createPlayer(); } };
function loadAPI() { apiWanted = true; retry.hidden = true; status.textContent = 'YouTubeに接続しています…'; readyTimeout = setTimeout(() => finish('YouTubeに接続できませんでした。接続を確認して再試行してください。', 'error'), 20000); const script = document.createElement('script'); script.src = 'https://www.youtube.com/iframe_api'; script.onerror = () => { script.remove(); finish('YouTubeに接続できませんでした。', 'error'); }; document.head.appendChild(script); }
retry.onclick = () => { if (window.YT && YT.Player) createPlayer(); else loadAPI(); };
document.getElementById('back').onclick = () => { window.location.replace(returnUrl); };
document.getElementById('search-input').oninput = event => { document.getElementById('search-button').disabled = !event.target.value.trim(); };
document.getElementById('search-form').onsubmit = event => { event.preventDefault(); const query = document.getElementById('search-input').value.trim(); if (!query) return; const url = new URL(returnUrl); url.searchParams.set('q', query); window.location.replace(url.toString()); };
document.getElementById('subscribe').onclick = () => { status.textContent = 'サブスクライブ操作はYouTube連携の追加後に利用できます。'; };
loadAPI();
</script></body></html>
